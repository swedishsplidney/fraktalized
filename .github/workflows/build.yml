name: compile and release binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt-platform: desktop
            artifact-name: fraktalized-linux
            file-name: fraktalized-linux-${{ github.ref_name }}.AppImage
            qt-arch: ''
          - os: windows-latest
            qt-platform: desktop
            artifact-name: fraktalized-windows
            file-name: fraktalized-windows-${{ github.ref_name }}.zip
            qt-arch: win64_msvc2022_64
          - os: macos-latest
            qt-platform: desktop
            artifact-name: fraktalized-mac
            file-name: fraktalized-mac-${{ github.ref_name }}.dmg
            qt-arch: ''

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # linux depends
      - name: install linux depends
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev xorg-dev libxkbcommon-dev libxcb-cursor0

      # force latest cmake to satisfy cmake version check
      - name: setup latest cmake
        uses: lukka/get-cmake@latest

      # set up python
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # install qt
      - name: install qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'windows-latest' && 'windows' || 'mac' }}
          target: ${{ matrix.qt-platform }}
          arch: ${{ matrix.qt-arch }}

      # mock missing legacy agl framework
      - name: create local agl framework mock
        if: matrix.os == 'macos-latest'
        run: echo "Stubbing framework generation directly within CMake config..."

      # configure cmake
      - name: configure cmake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # build binary
      - name: build binary
        run: |
          cmake --build build --config Release

      # platform specific stuff

      # windows exe
      - name: package windows binary
        if: matrix.os == 'windows-latest'
        run: |
          cd build/Release
          windeployqt --qmldir ../../ fraktalized.exe
          tar.exe -a -c -f ../../fraktalized-windows-${{ github.ref_name }}.zip *

      # package macos app
      - name: package macos app
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=$(find build -name "fraktalized.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find fraktalized.app bundle anywhere in build directory."
            echo "Contents of build directory for debugging:"
            ls -R build
            exit 1
          fi
          
          macdeployqt "$APP_PATH" -qmldir=. -dmg
          
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          mv "$DMG_PATH" fraktalized-mac-${{ github.ref_name }}.dmg

      # package linux binary
      - name: package linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          
          wget -q -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          LINUX_BIN=$(find build -maxdepth 2 -name "fraktalized" -type f -executable | head -n 1)
          cp "$LINUX_BIN" AppDir/usr/bin/
          
          cat <<EOF > AppDir/usr/share/applications/fraktalized.desktop
          [Desktop Entry]
          Type=Application
          Name=Fraktalized
          Exec=fraktalized
          Icon=fraktalized
          Categories=Utility;
          EOF
          
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > AppDir/usr/share/icons/hicolor/256x256/apps/fraktalized.png
          
          QT_INSTALL_DIR=$(find /home/runner/work/ -name "gcc_64" -type d | head -n 1)
          if [ -z "$QT_INSTALL_DIR" ]; then
            echo "Error: Could not locate Qt6 installation directory automatically."
            exit 1
          fi
          
          export QMAKE="${QT_INSTALL_DIR}/bin/qmake"
          export PATH="${QT_INSTALL_DIR}/bin:$PATH"
          
          # Point this directly to your project root to scan ALL subdirectories for .qml files
          export QML_SOURCES_PATHS="."
          
          export FORCE_KEYFOOTPRINT=1
          export APPIMAGE_EXTRACT_AND_RUN=1
          export EXTRA_QT_PLUGINS="platformthemes,styles"
          
          # Run linuxdeploy ONCE with the plugin and output flag together
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage
          
          # Inject the theme engine fix directly into the generated AppRun file afterward
          if [ -f "AppDir/AppRun" ]; then
            sed -i 's|#!/bin/bash|#!/bin/bash\nexport QT_QPA_PLATFORMTHEME=gtk3|' AppDir/AppRun
          fi
          
          rm linuxdeploy-x86_64.AppImage
          rm linuxdeploy-plugin-qt-x86_64.AppImage
          
          REAL_APPIMAGE=$(find . -maxdepth 1 -name "*.AppImage" | head -n 1)
          mv "$REAL_APPIMAGE" "fraktalized-linux-${{ github.ref_name }}.AppImage"

      # upload finished binaries to workflow run storage
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.file-name }}
          if-no-files-found: ignore

      # each runner
      - name: upload binaries to github release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file-name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}