name: compile and release binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt-platform: desktop
            artifact-name: fraktalized-linux
            qt-arch: ''
          - os: windows-latest
            qt-platform: desktop
            artifact-name: fraktalized-windows
            qt-arch: win64_msvc2022_64
          - os: macos-latest
            qt-platform: desktop
            artifact-name: fraktalized-mac
            qt-arch: ''

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # linux depends
      - name: install linux depends
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev xorg-dev libxkbcommon-dev

      # force latest cmake to satisfy cmake version check
      - name: setup latest cmake
        uses: lukka/get-cmake@latest

      # set up python
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # install qt
      - name: install qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'windows-latest' && 'windows' || 'mac' }}
          target: ${{ matrix.qt-platform }}
          arch: ${{ matrix.qt-arch }}

      # qt hotfix
      - name: patch qt agl framework
        if: matrix.os == 'macos-latest'
        run: |
          sed -i '' 's/-framework AGL//g' "$QT_ROOT_DIR/lib/cmake/Qt6/FindWrapOpenGL.cmake"

      # configure cmake
      - name: configure cmake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.os == 'macos-latest' && '-DCMAKE_MACOSX_BUNDLE=ON' || '' }}

      # build binary
      - name: build binary
        run: |
          cmake --build build --config Release

      # platform specific stuff
      - name: package windows binary
        if: matrix.os == 'windows-latest'
        run: |
          cd build/Release
          windeployqt --qmldir ../../ fraktalized.exe
          powershell Compress-Archive -Path * -DestinationPath ../../fraktalized-windows-${{ github.ref_name }}.zip

      - name: package macos app
        if: matrix.os == 'macos-latest'
        run: |
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          
          APP_PATH=$(find build -name "fraktalized.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find fraktalized.app bundle anywhere in build directory."
            echo "Contents of build directory for debugging:"
            ls -R build
            exit 1
          fi
          
          macdeployqt "$APP_PATH" -qmldir=. -dmg
          
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          mv "$DMG_PATH" fraktalized-mac-${{ github.ref_name }}.dmg

      - name: package linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build
          LINUX_BIN=$(find . -maxdepth 2 -name "fraktalized" -type f -executable | head -n 1)
          tar -czf ../fraktalized-linux-${{ github.ref_name }}.tar.gz "$LINUX_BIN"

      # upload finished binaries
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            fraktalized-windows-${{ github.ref_name }}.zip
            fraktalized-mac-${{ github.ref_name }}.dmg
            fraktalized-linux-${{ github.ref_name }}.tar.gz
          if-no-files-found: ignore